name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # `npm run vscode:prepublish` publishes the .NET core into dist/core, so the SDK must be
      # present. The SDK version comes from `global.json` (the sidecar targets net10.0).
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run vscode:prepublish

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: C# tests
        run: dotnet test NugetPackageManager.slnx -c Release

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Run Tests
        run: |
          rm -rf out
          npm run test-compile
          xvfb-run -a npm test
